<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birusk Core</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <style>
        :root {
            --bg-base: #0f172a; --bg-surface: #1e293b; --primary: #6366f1;
            --primary-hover: #4f46e5; --text-main: #f8fafc; --text-muted: #94a3b8;
            --border: #334155; --danger: #ef4444; --success: #10b981;
        }
        [data-theme="light"] {
            --bg-base: #f1f5f9; --bg-surface: #ffffff; --primary: #4f46e5;
            --primary-hover: #4338ca; --text-main: #0f172a; --text-muted: #64748b;
            --border: #e2e8f0;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; transition: background 0.3s; }
        
        /* Modern Inputs */
        input, select {
            padding: 12px 16px; border-radius: 10px; border: 2px solid var(--border);
            background: var(--bg-base); color: var(--text-main); outline: none;
            transition: all 0.3s ease; font-size: 0.95rem;
        }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        
        button {
            padding: 12px 24px; border-radius: 10px; border: none;
            background: var(--primary); color: white; font-weight: 600;
            cursor: pointer; transition: background 0.2s, transform 0.1s;
        }
        button:hover { background: var(--primary-hover); transform: translateY(-1px); }
        button:active { transform: translateY(1px); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #dc2626; }
        
        /* Layout & Sidebar */
        .sidebar {
            width: 260px; background-color: var(--bg-surface); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 1000;
        }
        .logo-area { padding: 24px; display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: bold; border-bottom: 1px solid var(--border); }
        .nav-items { flex: 1; padding: 20px 12px; display: flex; flex-direction: column; gap: 8px; }
        .nav-item { padding: 12px 16px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; color: var(--text-muted); text-decoration: none; transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background-color: rgba(99, 102, 241, 0.1); color: var(--primary); }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { height: 70px; background-color: var(--bg-surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
        .content-area { flex: 1; padding: 24px; overflow-y: auto; }
        
        .card { background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .card-title { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px; }
        .card-value { display: block; font-size: 1.8rem; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid var(--border); }
        
        /* Mobile Specific */
        .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 999; opacity: 0; transition: opacity 0.3s ease; }
        #mobile-menu-btn { display: none; padding: 8px 12px; font-size: 1.2rem; background: transparent; border: 1px solid var(--border); color: var(--text-main); border-radius: 8px; }
        
        @media (max-width: 768px) {
            .sidebar { position: fixed; height: 100%; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            #mobile-menu-btn { display: block; }
        }
        
        /* RTL Support for Farsi and Kurdish */
        [dir="rtl"] .sidebar { border-right: none; border-left: 1px solid var(--border); }
        [dir="rtl"] th, [dir="rtl"] td { text-align: right; }
        @media (max-width: 768px) {
            [dir="rtl"] .sidebar { transform: translateX(100%); right: 0; left: auto; }
            [dir="rtl"] .sidebar.open { transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="logo-area">⚡ Birusk</div>
        <div class="nav-items">
            <a href="#" class="nav-item active" data-page="dashboard" data-i18n="nav_dashboard">Dashboard</a>
            <a href="#" class="nav-item" data-page="users" data-i18n="nav_users">Users</a>
            <a href="#" class="nav-item" data-page="nodes" data-i18n="nav_nodes">Nodes</a>
        </div>
    </div>
    <div class="main-content">
        <div class="header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button id="mobile-menu-btn">☰</button>
                <h2 id="page-title" data-i18n="nav_dashboard">Dashboard</h2>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <select id="lang-selector">
                    <option value="en">English</option>
                    <option value="fa">فارسی</option>
                    <option value="ku">Kurdî</option>
                </select>
                <button id="theme-toggle" style="padding: 8px; background: transparent; border: 1px solid var(--border); color: var(--text-main); border-radius: 8px;">🌓</button>
            </div>
        </div>
        <div class="content-area" id="content"></div>
    </div>

    <script>
        const translations = {
            en: {
                nav_dashboard: "Dashboard", nav_users: "Users", nav_nodes: "Nodes",
                card_total_users: "Total Users", card_active_nodes: "Active Nodes",
                card_network_traffic: "Network Traffic", card_system_status: "System Status",
                status_online: "Online", btn_add_user: "Add User", btn_add_node: "Add Node",
                table_name: "Name", table_usage: "Usage / Limit", table_status: "Status"
            },
            fa: {
                nav_dashboard: "داشبورد", nav_users: "کاربران", nav_nodes: "سرورها (نود)",
                card_total_users: "کل کاربران", card_active_nodes: "نودهای فعال",
                card_network_traffic: "ترافیک مصرفی", card_system_status: "وضعیت سیستم",
                status_online: "آنلاین", btn_add_user: "افزودن کاربر", btn_add_node: "افزودن نود",
                table_name: "نام", table_usage: "مصرف / سقف مجاز", table_status: "وضعیت"
            },
            ku: {
                nav_dashboard: "داشبۆرد", nav_users: "بەکارهێنەران", nav_nodes: "سێرڤەرەکان (نۆد)",
                card_total_users: "کۆی بەکارهێنەران", card_active_nodes: "نۆدە چالاکەکان",
                card_network_traffic: "ترافیکی بەکارهاتوو", card_system_status: "دۆخی سیستەم",
                status_online: "ئۆنلاین", btn_add_user: "زیادکردنی بەکارهێنەر", btn_add_node: "زیادکردنی نۆد",
                table_name: "ناو", table_usage: "بەکارهاتوو / سنوور", table_status: "دۆخ"
            }
        };
    </script>
    <script src="app.js"></script>
</body>
</html>
